name: Release user app

# Builds the CoffeeApp (userapp) release APK and publishes it as a GitHub release.
# Run it from the Actions tab, or push a tag named userapp-v<version>.
on:
  workflow_dispatch:
  push:
    tags:
      - 'userapp-v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Read version
        id: version
        run: |
          name=$(sed -nE 's/^\s*versionName\s*=\s*"([^"]+)".*/\1/p' userapp/build.gradle.kts | head -1)
          code=$(sed -nE 's/^\s*versionCode\s*=\s*([0-9]+).*/\1/p' userapp/build.gradle.kts | head -1)
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: Set up release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.USERAPP_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/userapp.jks"
            echo "USERAPP_KEYSTORE_FILE=$RUNNER_TEMP/userapp.jks" >> "$GITHUB_ENV"
            echo "SIGNING=release key" >> "$GITHUB_ENV"
          else
            echo "::warning::USERAPP_KEYSTORE_BASE64 is not set, the APK is signed with a throwaway debug key"
            echo "SIGNING=debug key (no release keystore configured)" >> "$GITHUB_ENV"
          fi

      - name: Build release APK
        env:
          USERAPP_KEYSTORE_PASSWORD: ${{ secrets.USERAPP_KEYSTORE_PASSWORD }}
          USERAPP_KEY_ALIAS: ${{ secrets.USERAPP_KEY_ALIAS }}
          USERAPP_KEY_PASSWORD: ${{ secrets.USERAPP_KEY_PASSWORD }}
        run: |
          ./gradlew --no-configuration-cache :userapp:assembleRelease
          cp userapp/build/outputs/apk/release/*.apk "CoffeeApp-${{ steps.version.outputs.name }}.apk"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.name }}
          CODE: ${{ steps.version.outputs.code }}
        run: |
          tag="${GITHUB_REF_NAME}"
          case "$tag" in userapp-v*) ;; *) tag="userapp-v$VERSION" ;; esac
          notes="CoffeeApp $VERSION (versionCode $CODE), built from ${GITHUB_SHA::7}. Signed with: $SIGNING."
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "CoffeeApp-$VERSION.apk" --clobber
          else
            gh release create "$tag" "CoffeeApp-$VERSION.apk" --target "$GITHUB_SHA" \
              --title "CoffeeApp $VERSION" --notes "$notes"
          fi
