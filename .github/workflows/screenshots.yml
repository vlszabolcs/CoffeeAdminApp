name: Screenshots

# Renders app screenshots with sample data (Robolectric + Roborazzi) and commits the PNGs
# to the "screenshots" folder of this branch. Used for the portfolio site.
on:
  push:
    branches: [screenshots]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Render screenshots
        run: |
          set -o pipefail
          ./gradlew --no-configuration-cache "-Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8" -Pscreenshots \
            :userapp:testDebugUnitTest :app:testDebugUnitTest 2>&1 | tee gradle-output.txt

      - name: Commit screenshots
        if: success()
        run: |
          rm -rf screenshots && mkdir -p screenshots
          cp userapp/build/screenshots/*.png app/build/screenshots/*.png screenshots/
          ls -la screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add screenshots
          git rm -q --cached -f screenshots/FAILED.txt 2>/dev/null || true
          git commit -m "Rendered screenshots" || echo "nothing changed"
          git push

      # On failure, commit the end of the build output and the test reports' failure messages,
      # so the problem can be read from the branch without downloading logs.
      - name: Commit failure details
        if: failure()
        run: |
          mkdir -p screenshots
          {
            echo "=== gradle output (last 200 lines) ==="
            tail -n 200 gradle-output.txt || true
            echo
            echo "=== test failures ==="
            for f in $(find . -path "*/test-results/*" -name "*.xml" 2>/dev/null); do
              grep -A25 "<failure" "$f" | head -60 || true
            done
          } > screenshots/FAILED.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add screenshots/FAILED.txt
          git commit -m "Screenshot run failed (details in screenshots/FAILED.txt)" || true
          git push
