name: Build APKs

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # four APKs are packaged in parallel: the 2 GB daemon of gradle.properties ran out once (packageDebug)
      - name: Build debug and release APKs of both apps, run the unit tests
        run: ./gradlew --no-configuration-cache "-Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8" :app:assembleDebug :userapp:assembleDebug :userapp:assembleRelease :app:assembleRelease :app:testDebugUnitTest :userapp:testDebugUnitTest :userview:testDebugUnitTest

      - name: Upload admin app APK
        uses: actions/upload-artifact@v4
        with:
          name: CoffeeAdmin-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload user app APK
        uses: actions/upload-artifact@v4
        with:
          name: CoffeeApp-debug-${{ github.sha }}
          path: userapp/build/outputs/apk/debug/*.apk
          if-no-files-found: error
